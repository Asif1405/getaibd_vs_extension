[package]
name = "mcp-universal"
version = "0.1.0"
edition = "2021"
description = "A universal MCP server bridging any client to any LLM backend"
license = "MIT"

[lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
# The VS Code extension always talks to the agent over HTTP/SSE, so the server
# is on by default here (the CLI vendoring of this engine keeps it off).
default = ["server"]
server = ["dep:axum", "dep:tower-http"]

[dependencies]
axum = { version = "0.7", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors"], optional = true }
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
git2 = { version = "0.19", default-features = false }
globset = "0.4"
async-recursion = "1.1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
chrono = { version = "0.4.43", features = ["serde"] }
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "getaibd-agent"
path = "src/main.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serial_test = "3"
wiremock = "0.6"
